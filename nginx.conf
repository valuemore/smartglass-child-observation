# Streamlit 리버스 프록시 설정
# 실제 배포 전 server_name과 ssl_certificate 경로를 교체하세요.

server {
    listen 443 ssl;
    server_name www.dece.re.kr;

    ssl_certificate     /etc/letsencrypt/live/www.dece.re.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.dece.re.kr/privkey.pem;

    # Streamlit WebSocket 및 SSE 지원
    location / {
        proxy_pass         http://app:8501;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }
}

# HTTP → HTTPS 리다이렉트
server {
    listen 80;
    server_name www.dece.re.kr;
    return 301 https://$host$request_uri;
}
