# nginx 리버스 프록시 설정
# HTTPS + Streamlit WebSocket + 대용량 영상 업로드(500MB) 지원

server {
    listen 80;
    server_name _;
    # HTTP → HTTPS 리디렉션
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name your-domain.com;   # 실제 도메인으로 교체

    # Let's Encrypt 인증서 (certbot으로 발급)
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 영상 파일 업로드 최대 크기 (300MB 여유분 포함)
    client_max_body_size 500M;

    # Streamlit WebSocket + HTTP 프록시
    location / {
        proxy_pass         http://streamlit:8501;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";   # WebSocket 필수
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;                   # 영상 분석 처리 시간 허용
    }
}
