# SmartGlass Streamlit 리버스 프록시 설정
# 배포 위치: /etc/nginx/sites-available/smartglass
# 심볼릭 링크: /etc/nginx/sites-enabled/smartglass -> sites-available/smartglass

server {
    listen 80;
    server_name www.dece.re.kr dece.re.kr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name www.dece.re.kr dece.re.kr;

    # 인증서 경로 (Let's Encrypt 발급 후 아래 경로로 교체)
    # ssl_certificate     /etc/letsencrypt/live/www.dece.re.kr/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/www.dece.re.kr/privkey.pem;
    ssl_certificate     /etc/ssl/smartglass/fullchain.pem;
    ssl_certificate_key /etc/ssl/smartglass/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 얼굴 사진(~10MB)·영상 파일(~500MB) 업로드 허용
    client_max_body_size 500M;

    location / {
        proxy_pass             http://127.0.0.1:8501;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout     86400;
        proxy_request_buffering off;
    }
}
