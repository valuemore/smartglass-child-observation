version: "3.9"

services:
  streamlit:
    build: .
    container_name: smartglass-app
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data          # 영상·프레임·DB 영속화 (git 제외 경로)
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - smartglass-net

  nginx:
    image: nginx:1.25-alpine
    container_name: smartglass-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro   # certbot 인증서 (서버에서 발급)
    depends_on:
      - streamlit
    restart: unless-stopped
    networks:
      - smartglass-net

networks:
  smartglass-net:
    driver: bridge
